<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>러닝화 · 풀업 기록</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2433; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6df6; --ok: #22a06b; --warn: #e59a0c; --bad: #d9434a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --card: #1b202b; --text: #e8ebf2; --muted: #98a1b5; --line: #2b3242; --accent: #6b9bff; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { padding: 8px 16px; border-radius: 99px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat, .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .v { font-size: 24px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); padding: 7px 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 9px; font-size: 13px; }
  input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  .section { margin-bottom: 24px; }
  .shoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; }
  .shoe.retired { opacity: .6; }
  .shoe .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .shoe .name { font-weight: 700; font-size: 16px; }
  .shoe .brand { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .meta b { color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); padding: 20px; width: min(92vw, 440px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { display: grid; gap: 12px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .hint { font-size: 12px; color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding-top: 6px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .chart .col .fill { width: 100%; max-width: 28px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
  .chart .col.zero .fill { background: var(--line); }
  .chart .col .val { font-size: 11px; color: var(--muted); height: 16px; }
  .chart .col .day { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  /* ---------- 반응형 공통 ---------- */
  html { -webkit-text-size-adjust: 100%; }
  html, body { max-width: 100%; overflow-x: hidden; }
  .row > * { min-width: 0; }
  .shoe .name, .shoe .brand { overflow-wrap: anywhere; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  .auto-sel { width: auto; min-width: 160px; }

  /* ---------- 모바일 (폭 600px 이하) ---------- */
  @media (max-width: 600px) {
    .wrap { padding-top: 14px; }
    h1 { font-size: 19px; }
    header > div { width: 100%; }
    header > div button { flex: 1; }
    .tabs button { flex: 1; padding: 10px 8px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
    .stat { padding: 12px; }
    .stat .v { font-size: 20px; }
    .card { padding: 12px; }
    .section { margin-bottom: 18px; }

    input, select, textarea { font-size: 16px; }
    input[type=date] { min-height: 40px; -webkit-appearance: none; appearance: none; }
    button { min-height: 40px; }
    button.small { min-height: 34px; padding: 6px 12px; }

    #runForm, #pullForm { grid-template-columns: 1fr 1fr; }
    #runForm > div:last-child, #pullForm > div:last-child, #pullForm .wide { grid-column: 1 / -1; }

    .toolbar { align-items: stretch; }
    .toolbar > * { max-width: 100%; }
    .auto-sel { width: 100%; }
    .shoes { grid-template-columns: 1fr; }
    .meta { flex-wrap: wrap; gap: 2px 12px; }

    /* 표 → 카드형 목록 */
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { padding: 8px 0; border-bottom: 1px solid var(--line); }
    td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 3px 0; border: 0; text-align: right;
      overflow-wrap: anywhere; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 13px; text-align: left; flex: none; }
    td.empty { display: block; }
    td.empty::before { content: none; }
    td.none { display: none; }
    td.act { justify-content: flex-end; padding-top: 6px; }
    td.act::before { content: none; }

    .chart { gap: 3px; height: 120px; }
    .chart .col .fill { max-width: none; }
    .chart .col .day, .chart .col .val { font-size: 10px; }
    .chart .col:nth-child(odd) .day { visibility: hidden; }

    dialog { width: calc(100vw - 24px); max-height: 90vh; overflow: auto; padding: 16px; }
    .toast { max-width: 90vw; text-align: center; bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏃 운동 기록</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnExport">백업(내보내기)</button>
      <button id="btnImport">불러오기</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="run" class="active">🏃 러닝화</button>
    <button data-tab="pull">💪 풀업</button>
  </nav>

  <!-- ===== 러닝화 탭 ===== -->
  <div id="tab-run">
    <div class="stats" id="stats"></div>

    <section class="section card">
      <h2>러닝 기록 추가</h2>
      <form id="runForm" class="row">
        <div><label for="runDate">날짜</label><input type="date" id="runDate" required></div>
        <div><label for="runShoe">러닝화</label><select id="runShoe" required></select></div>
        <div><label for="runKm">거리 (km)</label><input type="number" id="runKm" min="0.01" step="0.01" inputmode="decimal" required></div>
        <div><label for="runMemo">메모</label><input type="text" id="runMemo" placeholder="선택"></div>
        <div><button type="submit" class="primary" style="width:100%">기록 추가</button></div>
      </form>
    </section>

    <section class="section">
      <div class="toolbar">
        <h2 style="margin:0">내 러닝화</h2>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <label style="margin:0;display:flex;align-items:center;gap:6px">
            <input type="checkbox" id="showRetired" style="width:auto"> 은퇴한 신발도 보기
          </label>
          <button id="btnAddShoe" class="primary">+ 러닝화 추가</button>
        </div>
      </div>
      <div class="shoes" id="shoes"></div>
    </section>

    <section class="section card">
      <div class="toolbar">
        <h2 style="margin:0">최근 기록</h2>
        <select id="filterShoe" class="auto-sel"></select>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>날짜</th><th>러닝화</th><th class="num">거리</th><th>메모</th><th></th></tr></thead>
        <tbody id="runs"></tbody>
      </table></div>
    </section>
  </div>

  <!-- ===== 풀업 탭 ===== -->
  <div id="tab-pull" hidden>
    <div class="stats" id="pullStats"></div>

    <section class="section card">
      <h2>풀업 기록 추가</h2>
      <form id="pullForm" class="row">
        <div><label for="pullDate">날짜</label><input type="date" id="pullDate" required></div>
        <div><label for="pullReps">횟수</label><input type="number" id="pullReps" min="1" step="1" inputmode="numeric" required></div>
        <div class="wide"><label for="pullMemo">메모</label><input type="text" id="pullMemo" placeholder="예) 3세트 합계, 와이드 그립"></div>
        <div><button type="submit" class="primary" style="width:100%">기록 추가</button></div>
      </form>
      <p class="hint" style="margin:8px 0 0">하루에 여러 번 기록해도 됩니다. 같은 날짜의 횟수는 합산돼요.</p>
    </section>

    <section class="section card">
      <h2>최근 14일</h2>
      <div class="chart" id="pullChart"></div>
    </section>

    <section class="section card">
      <h2>풀업 기록</h2>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>날짜</th><th class="num">횟수</th><th>메모</th><th></th></tr></thead>
        <tbody id="pulls"></tbody>
      </table></div>
    </section>
  </div>
</div>

<dialog id="shoeDlg">
  <form id="shoeForm" method="dialog">
    <h2 id="shoeDlgTitle">러닝화 추가</h2>
    <div><label for="sName">이름 *</label><input id="sName" required maxlength="40" placeholder="예) 페가수스 41"></div>
    <div><label for="sBrand">브랜드</label><input id="sBrand" maxlength="30" placeholder="예) Nike"></div>
    <div class="row">
      <div><label for="sLimit">교체 권장 거리 (km)</label><input type="number" id="sLimit" min="1" step="1" value="800" required></div>
      <div><label for="sInit">기존 주행 거리 (km)</label><input type="number" id="sInit" min="0" step="0.1" value="0"></div>
    </div>
    <div><label for="sDate">구입일</label><input type="date" id="sDate"></div>
    <p class="hint">일반적으로 러닝화는 500~800km 사이에 교체를 권장합니다.</p>
    <div class="dlg-actions">
      <button type="button" id="shoeCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'running-shoes-v1';
  let state = { shoes: [], runs: [], pullups: [] };
  let editingId = null;
  const $ = id => document.getElementById(id);

  // ---------- 저장/불러오기 ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.shoes) && Array.isArray(d.runs)) {
          state = { shoes: d.shoes, runs: d.runs, pullups: Array.isArray(d.pullups) ? d.pullups : [] };
        }
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('저장에 실패했어요. 백업을 내려받아 주세요.'); }
  }

  // ---------- 유틸 ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const fmt = n => (Math.round(n * 10) / 10).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const shoeKm = s => (Number(s.initialKm) || 0) + state.runs.filter(r => r.shoeId === s.id).reduce((a, r) => a + r.km, 0);
  const shoeById = id => state.shoes.find(s => s.id === id);

  // ---------- 렌더링 ----------
  function render() {
    renderStats(); renderSelects(); renderShoes(); renderRuns(); renderPull();
  }

  function renderStats() {
    const active = state.shoes.filter(s => !s.retired);
    const total = state.runs.reduce((a, r) => a + r.km, 0);
    const now = new Date(), ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const month = state.runs.filter(r => r.date.startsWith(ym)).reduce((a, r) => a + r.km, 0);
    const warn = active.filter(s => shoeKm(s) / s.limitKm >= 0.9).length;
    $('stats').innerHTML = `
      <div class="stat"><div class="v">${fmt(total)} km</div><div class="l">누적 기록 거리</div></div>
      <div class="stat"><div class="v">${fmt(month)} km</div><div class="l">이번 달</div></div>
      <div class="stat"><div class="v">${active.length}켤레</div><div class="l">사용 중인 신발</div></div>
      <div class="stat"><div class="v" style="color:${warn ? 'var(--bad)' : 'inherit'}">${warn}켤레</div><div class="l">교체 임박 (90%↑)</div></div>`;
  }

  function renderSelects() {
    const active = state.shoes.filter(s => !s.retired);
    const cur = $('runShoe').value;
    $('runShoe').innerHTML = active.length
      ? active.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')
      : '<option value="">먼저 러닝화를 추가하세요</option>';
    if (active.some(s => s.id === cur)) $('runShoe').value = cur;

    const f = $('filterShoe').value || 'all';
    $('filterShoe').innerHTML = '<option value="all">전체 러닝화</option>' +
      state.shoes.map(s => `<option value="${s.id}">${esc(s.name)}${s.retired ? ' (은퇴)' : ''}</option>`).join('');
    $('filterShoe').value = state.shoes.some(s => s.id === f) ? f : 'all';
  }

  function renderShoes() {
    const showRetired = $('showRetired').checked;
    const list = state.shoes.filter(s => showRetired || !s.retired);
    if (!list.length) {
      $('shoes').innerHTML = '<div class="empty card" style="grid-column:1/-1">등록된 러닝화가 없어요. “+ 러닝화 추가”를 눌러 시작하세요.</div>';
      return;
    }
    $('shoes').innerHTML = list.map(s => {
      const km = shoeKm(s), pct = Math.min(100, km / s.limitKm * 100);
      const color = pct >= 100 ? 'var(--bad)' : pct >= 75 ? 'var(--warn)' : 'var(--ok)';
      const remain = s.limitKm - km;
      const last = state.runs.filter(r => r.shoeId === s.id).map(r => r.date).sort().pop();
      const count = state.runs.filter(r => r.shoeId === s.id).length;
      const status = s.retired ? '<span class="badge">은퇴</span>'
        : pct >= 100 ? '<span class="badge" style="background:var(--bad);color:#fff">교체 필요</span>'
        : pct >= 90 ? '<span class="badge" style="background:var(--warn);color:#fff">교체 임박</span>' : '';
      return `<div class="card shoe ${s.retired ? 'retired' : ''}">
        <div class="top">
          <div><div class="name">${esc(s.name)}</div><div class="brand">${esc(s.brand || '브랜드 미입력')}</div></div>
          ${status}
        </div>
        <div class="bar"><div style="width:${pct}%;background:${color}"></div></div>
        <div class="meta"><span><b>${fmt(km)}</b> / ${fmt(s.limitKm)} km (${Math.round(pct)}%)</span>
          <span>${remain >= 0 ? fmt(remain) + ' km 남음' : fmt(-remain) + ' km 초과'}</span></div>
        <div class="meta" style="margin-top:4px"><span>${count}회 · 최근 ${last || '-'}</span><span>${s.buyDate ? '구입 ' + esc(s.buyDate) : ''}</span></div>
        <div class="actions">
          <button class="small" data-act="edit" data-id="${s.id}">수정</button>
          <button class="small" data-act="retire" data-id="${s.id}">${s.retired ? '다시 사용' : '은퇴'}</button>
          <button class="small danger" data-act="del" data-id="${s.id}">삭제</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderRuns() {
    const f = $('filterShoe').value;
    const list = state.runs.filter(r => f === 'all' || r.shoeId === f)
      .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 100);
    $('runs').innerHTML = list.length ? list.map(r => {
      const s = shoeById(r.shoeId);
      return `<tr><td data-label="날짜">${esc(r.date)}</td><td data-label="러닝화">${esc(s ? s.name : '(삭제됨)')}</td>
        <td class="num" data-label="거리">${fmt(r.km)} km</td><td data-label="메모" class="${r.memo ? '' : 'none'}">${esc(r.memo)}</td>
        <td class="num act"><button class="small danger" data-run="${r.id}">삭제</button></td></tr>`;
    }).join('') : '<tr><td colspan="5" class="empty">기록이 없어요.</td></tr>';
  }

  // ---------- 풀업 ----------
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  function renderPull() {
    const t = today(), ym = t.slice(0, 7);
    const sum = f => state.pullups.filter(f).reduce((a, p) => a + p.reps, 0);
    const byDay = {};
    state.pullups.forEach(p => { byDay[p.date] = (byDay[p.date] || 0) + p.reps; });
    const bestDay = Object.values(byDay).reduce((m, v) => Math.max(m, v), 0);
    $('pullStats').innerHTML = `
      <div class="stat"><div class="v">${sum(p => p.date === t)}개</div><div class="l">오늘</div></div>
      <div class="stat"><div class="v">${sum(p => p.date.startsWith(ym))}개</div><div class="l">이번 달</div></div>
      <div class="stat"><div class="v">${sum(() => true)}개</div><div class="l">누적 횟수</div></div>
      <div class="stat"><div class="v">${bestDay}개</div><div class="l">하루 최고 기록</div></div>`;

    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(t + 'T00:00:00'); d.setDate(d.getDate() - i);
      const k = ymd(d);
      days.push({ k, label: (d.getMonth() + 1) + '/' + d.getDate(), v: byDay[k] || 0 });
    }
    const max = Math.max(1, ...days.map(d => d.v));
    $('pullChart').innerHTML = days.map(d =>
      `<div class="col ${d.v ? '' : 'zero'}"><div class="val">${d.v || ''}</div>
        <div class="fill" style="height:${d.v / max * 80}px"></div><div class="day">${d.label}</div></div>`).join('');

    const list = state.pullups.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 100);
    $('pulls').innerHTML = list.length ? list.map(p =>
      `<tr><td data-label="날짜">${esc(p.date)}</td><td class="num" data-label="횟수">${p.reps}개</td>
        <td data-label="메모" class="${p.memo ? '' : 'none'}">${esc(p.memo)}</td>
        <td class="num act"><button class="small danger" data-pull="${p.id}">삭제</button></td></tr>`).join('')
      : '<tr><td colspan="4" class="empty">기록이 없어요.</td></tr>';
  }

  // ---------- 이벤트 ----------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    $('tab-run').hidden = b.dataset.tab !== 'run';
    $('tab-pull').hidden = b.dataset.tab !== 'pull';
  }));

  $('runForm').addEventListener('submit', e => {
    e.preventDefault();
    const shoeId = $('runShoe').value, km = parseFloat($('runKm').value);
    if (!shoeId) return toast('먼저 러닝화를 추가하세요.');
    if (!(km > 0)) return toast('거리를 올바르게 입력하세요.');
    state.runs.push({ id: uid(), shoeId, date: $('runDate').value || today(), km, memo: $('runMemo').value.trim() });
    save();
    $('runKm').value = ''; $('runMemo').value = '';
    render(); toast('기록을 추가했어요 🏃');
  });

  $('pullForm').addEventListener('submit', e => {
    e.preventDefault();
    const reps = parseInt($('pullReps').value, 10);
    if (!(reps > 0)) return toast('횟수를 올바르게 입력하세요.');
    state.pullups.push({ id: uid(), date: $('pullDate').value || today(), reps, memo: $('pullMemo').value.trim() });
    save();
    $('pullReps').value = ''; $('pullMemo').value = '';
    render(); toast(`풀업 ${reps}개 기록했어요 💪`);
  });

  $('pulls').addEventListener('click', e => {
    const b = e.target.closest('button[data-pull]'); if (!b) return;
    if (confirm('이 기록을 삭제할까요?')) {
      state.pullups = state.pullups.filter(p => p.id !== b.dataset.pull);
      save(); render();
    }
  });

  function openShoeDlg(shoe) {
    editingId = shoe ? shoe.id : null;
    $('shoeDlgTitle').textContent = shoe ? '러닝화 수정' : '러닝화 추가';
    $('sName').value = shoe ? shoe.name : '';
    $('sBrand').value = shoe ? shoe.brand : '';
    $('sLimit').value = shoe ? shoe.limitKm : 800;
    $('sInit').value = shoe ? shoe.initialKm : 0;
    $('sDate').value = shoe ? shoe.buyDate : '';
    $('shoeDlg').showModal();
  }
  $('btnAddShoe').onclick = () => openShoeDlg(null);
  $('shoeCancel').onclick = () => $('shoeDlg').close();
  $('shoeForm').addEventListener('submit', e => {
    const data = {
      name: $('sName').value.trim(), brand: $('sBrand').value.trim(),
      limitKm: parseFloat($('sLimit').value) || 800, initialKm: parseFloat($('sInit').value) || 0,
      buyDate: $('sDate').value
    };
    if (!data.name) { e.preventDefault(); return; }
    if (editingId) Object.assign(shoeById(editingId), data);
    else state.shoes.push({ id: uid(), retired: false, ...data });
    save(); render(); toast('저장했어요.');
  });

  $('shoes').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const s = shoeById(b.dataset.id); if (!s) return;
    if (b.dataset.act === 'edit') openShoeDlg(s);
    else if (b.dataset.act === 'retire') { s.retired = !s.retired; save(); render(); }
    else if (b.dataset.act === 'del') {
      const n = state.runs.filter(r => r.shoeId === s.id).length;
      if (confirm(`“${s.name}”을(를) 삭제할까요?${n ? `\n이 신발의 기록 ${n}건도 함께 삭제됩니다.` : ''}`)) {
        state.shoes = state.shoes.filter(x => x.id !== s.id);
        state.runs = state.runs.filter(r => r.shoeId !== s.id);
        save(); render();
      }
    }
  });

  $('runs').addEventListener('click', e => {
    const b = e.target.closest('button[data-run]'); if (!b) return;
    if (confirm('이 기록을 삭제할까요?')) {
      state.runs = state.runs.filter(r => r.id !== b.dataset.run);
      save(); render();
    }
  });

  $('showRetired').onchange = renderShoes;
  $('filterShoe').onchange = renderRuns;

  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `workout-log-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('btnImport').onclick = () => $('fileImport').click();
  $('fileImport').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!Array.isArray(d.shoes) || !Array.isArray(d.runs)) throw 0;
        if (!confirm('현재 데이터를 불러온 파일로 덮어쓸까요?')) return;
        state = { shoes: d.shoes, runs: d.runs, pullups: Array.isArray(d.pullups) ? d.pullups : [] };
        save(); render(); toast('불러왔어요.');
      } catch (err) { toast('올바른 백업 파일이 아니에요.'); }
    };
    rd.readAsText(f); e.target.value = '';
  };

  // ---------- 시작 ----------
  load();
  $('runDate').value = today();
  $('pullDate').value = today();
  render();
})();
</script>
</body>
</html>
